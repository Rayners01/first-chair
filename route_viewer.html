<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Optimal Ski Day</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    background: rgba(255,255,255,.92); border-radius: 10px; padding: 12px 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25); min-width: 260px;
  }
  #panel h1 { font-size: 15px; margin: 0 0 8px; }
  #stats { font-size: 13px; line-height: 1.5; margin: 8px 0; white-space: pre; }
  #leg { font-size: 13px; font-weight: 600; min-height: 18px; }
  #scrub { width: 100%; }
  button { cursor: pointer; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Optimal Ski Day</h1>
  <input type="file" id="file" accept=".json">
  <div id="stats">load a route.json from any solver (--out)</div>
  <div id="leg"></div>
  <input type="range" id="scrub" min="0" max="1000" value="0" disabled>
  <button id="play" disabled>&#9654; play</button>
  <select id="speed">
    <option value="60">60x</option>
    <option value="180" selected>180x</option>
    <option value="600">600x</option>
  </select>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const COLORS = { run: "#d62828", lift: "#1d3557", walk: "#8d6a3f", skate: "#2a9d8f" };

const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/liberty",
  center: [11.02, 46.97], zoom: 12, pitch: 60, bearing: -20,
});
map.addControl(new maplibregl.NavigationControl());

map.on("load", () => {
  map.addSource("dem", {
    type: "raster-dem",
    tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
    encoding: "terrarium", tileSize: 256, maxzoom: 13,
  });
  map.setTerrain({ source: "dem", exaggeration: 1.3 });
  map.addLayer({ id: "hills", type: "hillshade", source: "dem",
                 paint: { "hillshade-exaggeration": 0.35 } });
});

// ---- route loading ---------------------------------------------------------
let route = null;      // { edges, budget_s }
let timeline = [];     // [{t0, t1, coords, edge}]
let marker = null;

document.getElementById("file").addEventListener("change", ev => {
  const f = ev.target.files[0];
  if (!f) return;
  f.text().then(txt => loadRoute(JSON.parse(txt)));
});

function loadRoute(data) {
  route = data;
  let t = 0;
  timeline = data.edges.map(e => {
    const seg = { t0: t, t1: t + e.seconds, coords: e.geometry, edge: e };
    t = seg.t1;
    return seg;
  });

  const fc = {
    type: "FeatureCollection",
    features: data.edges.map(e => ({
      type: "Feature",
      properties: { kind: e.type },
      geometry: { type: "LineString", coordinates: e.geometry.map(c => [c[0], c[1]]) },
    })),
  };
  if (map.getSource("route")) map.getSource("route").setData(fc);
  else {
    map.addSource("route", { type: "geojson", data: fc });
    map.addLayer({
      id: "route", type: "line", source: "route",
      layout: { "line-cap": "round", "line-join": "round" },
      paint: {
        "line-width": 3.5,
        "line-color": ["match", ["get", "kind"],
          "run", COLORS.run, "lift", COLORS.lift,
          "walk", COLORS.walk, COLORS.skate],
      },
    });
  }

  const b = new maplibregl.LngLatBounds();
  fc.features.forEach(f => f.geometry.coordinates.forEach(c => b.extend(c)));
  map.fitBounds(b, { padding: 60, pitch: 60 });

  if (!marker) marker = new maplibregl.Marker({ color: "#000" })
    .setLngLat(fc.features[0].geometry.coordinates[0]).addTo(map);

  document.getElementById("scrub").disabled = false;
  document.getElementById("play").disabled = false;
  clock = 0;
  render();
}

// ---- playback --------------------------------------------------------------
let clock = 0, playing = false, lastFrame = null;
const totalTime = () => timeline.length ? timeline[timeline.length - 1].t1 : 0;

function positionAt(t) {
  const seg = timeline.find(s => t <= s.t1) || timeline[timeline.length - 1];
  const f = Math.min(1, Math.max(0, (t - seg.t0) / (seg.t1 - seg.t0 || 1)));
  const pts = seg.coords, idx = f * (pts.length - 1);
  const i = Math.min(pts.length - 2, Math.floor(idx)), u = idx - i;
  return {
    seg,
    lnglat: [pts[i][0] + u * (pts[i + 1][0] - pts[i][0]),
             pts[i][1] + u * (pts[i + 1][1] - pts[i][1])],
  };
}

function hhmm(t) {
  const s = 9 * 3600 + t;
  return `${String(Math.floor(s / 3600)).padStart(2, "0")}:` +
         `${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}`;
}

function render() {
  if (!timeline.length) return;
  const { seg, lnglat } = positionAt(clock);
  marker.setLngLat(lnglat);

  let vert = 0, dist = 0, runs = new Set();
  for (const s of timeline) {
    if (s.t0 > clock) break;
    const done = Math.min(1, (clock - s.t0) / (s.t1 - s.t0 || 1));
    dist += s.edge.length_m * done;
    if (s.edge.type === "run") {
      vert += s.edge.vertical_m * done;
      if (done >= 1) runs.add(s.edge.name || s.t0);
    }
  }
  document.getElementById("stats").textContent =
    `time      ${hhmm(clock)}\n` +
    `vertical  ${Math.round(vert).toLocaleString()} m\n` +
    `distance  ${(dist / 1000).toFixed(1)} km\n` +
    `runs done ${runs.size}`;
  const icon = { run: "\u25BC skiing", lift: "\u25B2 riding",
                 walk: "\u26A0 walking", skate: "~ skating" }[seg.edge.type];
  document.getElementById("leg").textContent =
    `${icon}  ${seg.edge.name || ""}`;
  document.getElementById("scrub").value =
    Math.round(1000 * clock / (totalTime() || 1));
}

function frame(ts) {
  if (!playing) return;
  if (lastFrame != null) {
    clock += (ts - lastFrame) / 1000 * +document.getElementById("speed").value;
    if (clock >= totalTime()) { clock = totalTime(); playing = false; }
  }
  lastFrame = ts;
  render();
  if (playing) requestAnimationFrame(frame);
}

document.getElementById("play").addEventListener("click", () => {
  playing = !playing;
  lastFrame = null;
  document.getElementById("play").innerHTML =
    playing ? "&#10074;&#10074; pause" : "&#9654; play";
  if (playing) requestAnimationFrame(frame);
});
document.getElementById("scrub").addEventListener("input", ev => {
  clock = ev.target.value / 1000 * totalTime();
  render();
});
</script>
</body>
</html>
